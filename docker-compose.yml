services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmpc
      POSTGRES_PASSWORD: cmpc123
      POSTGRES_DB: cmpc_libros
    ports:
      - "5432:5432"
    volumes:
      - cmpc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpc -d cmpc_libros"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cmpc:cmpc123@db:5432/cmpc_libros
      JWT_SECRET: jwt_secret_cambiarlo
      JWT_EXPIRES_IN: 1h
    ports:
      - "3000:3000"

volumes:
  cmpc_pgdata: